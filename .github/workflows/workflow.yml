name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint
        # Configuration lives in .flake8 so local and CI runs agree.
        run: uv run flake8 app/ scripts/ tests/

      - name: Run tests
        # The suite is fully offline — no OpenAI key, no network, and no FAISS
        # artifacts required — so it runs on a clean checkout.
        run: uv run pytest tests/ -v --tb=short
