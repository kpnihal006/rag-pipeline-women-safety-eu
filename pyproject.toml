[project]
name = "rag-pipeline-women-safety"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flake8>=7.3.0",
    "pymupdf>=1.27.2.2",
    "pytest>=9.0.3",
    "python-dotenv>=1.0.0",
    "faiss-cpu>=1.9.0",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "pdfplumber>=0.11.0",
    "gradio>=4.0.0",
    "rank-bm25>=0.2.2",
    "nltk>=3.8",
    "ragas>=0.2.0",
    "datasets>=2.0.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    # Agentic layer
    "fastmcp>=2.0.0",
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
    "botbuilder-core>=4.17.1",
    "botbuilder-integration-aiohttp>=4.17.1",
    "botbuilder-schema>=4.17.1",
    "ngrok>=1.7.0",
    # Report -> PDF rendering (scripts/make_pdf.py)
    "markdown>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git", ".venv", "venv", "data", "reports", "traces",
    "ilovepdf_split-range", "NLP", "__pycache__", "node_modules",
]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
